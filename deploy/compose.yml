services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rag_demo}
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
  docling:
    profiles: ["documents"]
    image: quay.io/docling-project/docling-serve-cpu:v1.32.0
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:?Set DOCLING_API_KEY}
      DOCLING_SERVE_MAX_FILE_SIZE: "26214400"
      DOCLING_SERVE_MAX_NUM_PAGES: "200"
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    mem_limit: 4g
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.61.16
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:?Set MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY}
      LITELLM_CHAT_TARGET: "openai/${CHAT_MODEL:-deepseek-v4-flash-0731}"
      LITELLM_EMBEDDING_TARGET: "openai/${EMBEDDING_MODEL:-qwen3.7-text-embedding-flash}"
      LITELLM_JUDGE_TARGET: "openai/${JUDGE_MODEL:-kimi-k3}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-internal-master-key}
      LITELLM_PORT: ${LITELLM_PORT:-4000}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
  es-data:
