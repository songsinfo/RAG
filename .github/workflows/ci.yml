name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - run: python -m pytest ../docs/reviews/pr-1/test_review.py -q -p no:cacheprovider --tb=short
      - name: Stack review regressions
        env:
          REVIEW_ROOT: ${{ github.workspace }}
        run: python -m pytest ../docs/reviews/pr-stack-20260921/test_stack_review.py -q -p no:cacheprovider --tb=short
      - name: Late-worker lease regression
        env:
          REVIEW_ROOT: ${{ github.workspace }}
        run: python -m pytest ../docs/reviews/pr-stack-20260921/test_late_worker.py -q -p no:cacheprovider --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
