name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - run: python -m pytest ../docs/reviews/pr-1/test_review.py -q -p no:cacheprovider --tb=short
      - name: Stack review regressions
        env:
          REVIEW_ROOT: ${{ github.workspace }}
        run: python -m pytest ../docs/reviews/pr-stack-20260921/test_stack_review.py -q -p no:cacheprovider --tb=short
      - name: Late-worker lease regression
        env:
          REVIEW_ROOT: ${{ github.workspace }}
        run: python -m pytest ../docs/reviews/pr-stack-20260921/test_late_worker.py -q -p no:cacheprovider --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build


  mysql-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: rag_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply production MySQL schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          mysql -h127.0.0.1 -P3306 -uroot -prootpass rag_demo < ../docs/design/schema.sql
      - name: Verify SQLAlchemy/MySQL schema contract
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: rag_demo
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from app.db import engine
          from app.models import index_build_table, model_call_table

          inspector = inspect(engine)
          for table in (index_build_table, model_call_table):
              actual = {column["name"]: column for column in inspector.get_columns(table.name)}
              missing = set(table.c.keys()) - set(actual)
              assert not missing, f"{table.name} missing columns: {sorted(missing)}"
              for column in table.c:
                  assert actual[column.name]["nullable"] == column.nullable, (
                      f"{table.name}.{column.name} nullable drift: "
                      f"MySQL={actual[column.name]['nullable']} metadata={column.nullable}"
                  )

          checks = " ".join(
              (item.get("sqltext") or "")
              for item in inspector.get_check_constraints("model_call")
          )
          assert "run_id IS NULL" in checks and "job_id IS NULL" in checks, checks
          PY
